name: Daily market brief

on:
  schedule:
    - cron: "17 22 * * *"   # 06:17 SGT daily (GitHub may start it a little late)
  workflow_dispatch:         # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-crew/requirements.txt

      - name: Install dependencies
        run: pip install -r news-crew/requirements.txt

      - name: Run news crew
        working-directory: news-crew
        continue-on-error: true   # a RAG upload hiccup shouldn't block the website
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
          RAG_BASE_URL:      ${{ secrets.RAG_BASE_URL }}
          RAG_USERNAME:      ${{ secrets.RAG_USERNAME }}
          RAG_PASSWORD:      ${{ secrets.RAG_PASSWORD }}
        run: python news_crew.py --type daily

      - name: Build market-news.json (fails if no fresh brief today)
        run: python news-crew/publish_json.py

      - name: Commit and push
        run: |
          git config user.name  "news-crew-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-news.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Market news: brief $(TZ=Asia/Singapore date +%F)"
          git push
